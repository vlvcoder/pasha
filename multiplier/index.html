<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">

    <title>Multiplier</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <div class="sidebar">
        <div id="timer" class="timer">0</div>
        <div class="legend">Time</div>
        <div id="score" class="timer score">0</div>
        <div class="legend">Score</div>
        <!-- <a href="#"><i class="fa fa-fw fa-play"></i> Start</a> -->
        <!-- <a href="#e"><i class="fa fa-fw fa-home"></i> Главная</a> -->
        <!-- <a href="#"><span class="material-icons">person</span> Главная</a>
        <a href="#"><i class="fa fa-fw fa-wrench"></i> Услуги</a>
        <a href="#"><i class="fa fa-fw fa-user"></i> Клинты</a>
        <a href="#"><i class="fa fa-fw fa-envelope"></i> Контакт</a> -->
    </div>

    <div class="main">
        <h1>Multiplier</h1>
        <div id="starter" class="starter">
            <div id="finalScore" class="final-score" style="display: none;">SCORE: 0</div>
            <a data-level="1" href="#">START 10</a>
            <a data-level="2" href="#">START 20</a>
            <a data-level="3" href="#">START 30</a>
        </div>
        <div id="line" class="line" style="display: none;">
            <div id="first" class="tag oper">0</div>
            <div class="tag sign">*</div>
            <div id="second" class="tag oper">0</div>
            <div class="tag sign">=</div>
            <div id="result" class="tag empty">?</div>
        </div>

        <div id="pool" class="pool"></div>
    </div>
    <script src="./js/main.js" type="module"></script>
</body>

</html>
