<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <title>Image Filters</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&display=swap');

        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: #ccc;
            font-family: "Comfortaa", sans-serif;
            font-optical-sizing: auto;
            font-weight: 700;
            font-style: normal;
            font-size: 18px;
            color: rgb(0, 0, 0, 0.6);
        }

        .container {
            width: 1000px;
            margin: 0 auto;
            background-color: #fff;
            padding: 20px;

            -webkit-box-shadow: 0px 2px 15px 0px rgba(34, 60, 80, 0.2);
            -moz-box-shadow: 0px 2px 15px 0px rgba(34, 60, 80, 0.2);
            box-shadow: 0px 2px 15px 0px rgba(34, 60, 80, 0.2);
        }

        h1 {
            text-align: center;
            margin-top: 0;
        }

        h2 {
            border-top: 1px solid #ccc;
            padding-top: 10px;
        }

        .variants {
            display: flex;
            justify-content: space-around;

            label {
                input[type="radio"] {
                    appearance: none;
                }

                img {
                    width: 200px;
                    height: 110px;
                    padding: 1px;
                    border-radius: 10px;
                    object-fit: cover;
                }
            }

            label:has(input[type="radio"]:checked) img {
                outline: 3px solid darkgoldenrod;

                -webkit-box-shadow: 0px 2px 26px 0px rgba(34, 60, 80, 0.42);
                -moz-box-shadow: 0px 2px 26px 0px rgba(34, 60, 80, 0.42);
                box-shadow: 0px 2px 26px 0px rgba(34, 60, 80, 0.42);
            }
        }

        .container>img {
            display: block;
            margin: 0 auto;
            width: 600px;
            transition: 1s;
            border-radius: 10px;
            margin-bottom: 100px;
        }

        .container>img:hover {
            filter: none !important;
        }

    </style>
</head>

<body>
    <div class="container">
        <h1>Image Filters</h1>
        <div class="variants"></div>
    </div>

    <button style="
        position: fixed;
        bottom: 20px;
        right: 20px;
        padding: 10px;
        border: 1px solid rgb(53 80 143);
        width: max-content;
        border-radius: 50%;
        box-shadow: 0px 2px 8px 0px rgba(0, 0, 0, 0.5);
        cursor: pointer;
    " onclick="window.location.assign('../')">
        <i class="fa fa-home" style="color: rgb(53 80 143); font-size: 32px;"></i>
    </button>

    <script>
        const IMAGES = [
            './back1.jpg',
            './back2.jpg',
            './back3.jpg',
            './back5.jpg',
        ];

        const FILTERS = [
            'blur(5px)',
            'contrast(200%)',
            'drop-shadow(16px 16px 20px blue)',
            'grayscale(80%)',
            'hue-rotate(90deg)',
            'invert(60%)',
            'opacity(25%)',            
            'saturate(30%)',            
            'sepia(80%)',            
            'contrast(175%) brightness(30%)',            
        ];

        const variants = document.querySelector('.variants');
        const container = document.querySelector('.container');

        const radios = [];
        IMAGES.forEach((path, ind) => {
            const checked = ind === 0 ? 'checked="checked"' : '';
            radios.push(`<label><input type="radio" name="srcImage" value="${ind}" ${checked}><img src="${path}" alt="img_${ind}"></label>`);
        });
        variants.innerHTML = radios.join('');

        document
            .querySelectorAll('input[type="radio"][name="srcImage"]')
            .forEach(radio => {
                radio
                    .addEventListener('change', () => {
                        document
                            .querySelectorAll('.container>img')
                            .forEach(image => image.setAttribute('src', IMAGES[radio.value]));
                    });
            });

        FILTERS.forEach(filter => {
            const h2 = document.createElement('h2');
            h2.textContent = filter;
            container.appendChild(h2);

            const img = document.createElement('img');
            img.style.filter = filter;
            img.setAttribute('src', IMAGES[0]);
            container.appendChild(img);
        });

    </script>

</body>

</html>
